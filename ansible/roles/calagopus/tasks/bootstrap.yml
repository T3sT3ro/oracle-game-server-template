# Runs before Caddy exists (the web role starts it later), so nobody can reach the panel
# until the admin exists, registration is off and the setup wizard is closed.

- name: Start database, cache and panel (not yet exposed)
  community.docker.docker_compose_v2:
    project_src: "{{ calagopus_stack_dir }}"
    services: [db, cache, panel]
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 300

# A captcha with an empty key would lock everyone out of the login page.
- name: Check the captcha settings
  ansible.builtin.assert:
    that:
      - calagopus_captcha_provider in ['', 'none', 'turnstile']
      - calagopus_captcha_provider != 'turnstile' or calagopus_turnstile_site_key | length > 0
      - calagopus_captcha_provider != 'turnstile' or vault_turnstile_secret_key | default('') | length > 0
    fail_msg: >-
      calagopus_captcha_provider must be "", "none" or "turnstile". For "turnstile", set
      calagopus_turnstile_site_key in vars.yml and vault_turnstile_secret_key in the vault.
    quiet: true

- name: Add the captcha to the enforced settings
  ansible.builtin.set_fact:
    calagopus_settings_all: >-
      {{ calagopus_settings | combine(
           {} if calagopus_captcha_provider == ''
           else {'::captcha_provider': 'none'} if calagopus_captcha_provider == 'none'
           else {'::captcha_provider': 'turnstile',
                 '::turnstile_site_key': calagopus_turnstile_site_key,
                 '::turnstile_secret_key': vault_turnstile_secret_key}) }}

# Only rows whose value differs are written; psql then prints "INSERT 0 <rows written>".
- name: Enforce security-relevant panel settings
  community.docker.docker_compose_v2_exec:
    project_src: "{{ calagopus_stack_dir }}"
    service: db
    tty: false
    argv:
      - psql
      - -U
      - panel
      - -d
      - panel
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        INSERT INTO settings (key, value) VALUES
        {% for k, v in calagopus_settings_all.items() %}('{{ k | replace("'", "''") }}', '{{ v | replace("'", "''") }}'){{ ',' if not loop.last }}{% endfor %}
        ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value
        WHERE settings.value IS DISTINCT FROM EXCLUDED.value
  register: calagopus_settings_write
  changed_when: "'INSERT 0 0' not in calagopus_settings_write.stdout"
  no_log: "{{ calagopus_captcha_provider == 'turnstile' }}" # the SQL holds the captcha secret

- name: Count panel users
  community.docker.docker_compose_v2_exec:
    project_src: "{{ calagopus_stack_dir }}"
    service: db
    tty: false
    argv: [psql, -U, panel, -d, panel, -tAc, "SELECT count(*) FROM users"]
  register: calagopus_users_count
  changed_when: false
  check_mode: false # read-only; must also run during --check

- name: Create the first admin (the web wizard would hand admin to whoever loads it first)
  community.docker.docker_compose_v2_exec:
    project_src: "{{ calagopus_stack_dir }}"
    service: panel
    tty: false
    argv:
      - panel-rs
      - users
      - create
      - --username
      - "{{ calagopus_admin_username }}"
      - --email
      - "{{ calagopus_admin_email }}"
      - --name-first
      - Server
      - --name-last
      - Admin
      - --password
      - "{{ vault_calagopus_admin_password }}"
      - --admin
      - "true"
  when: calagopus_users_count.stdout | trim | int == 0
  no_log: true
  changed_when: true

- name: Check whether the OOBE wizard is still open
  community.docker.docker_compose_v2_exec:
    project_src: "{{ calagopus_stack_dir }}"
    service: db
    tty: false
    argv: [psql, -U, panel, -d, panel, -tAc, "SELECT count(*) FROM settings WHERE key = 'oobe_step' AND value = ''"]
  register: calagopus_oobe_closed
  changed_when: false
  check_mode: false # read-only; must also run during --check

- name: Close the OOBE wizard
  community.docker.docker_compose_v2_exec:
    project_src: "{{ calagopus_stack_dir }}"
    service: panel
    tty: false
    argv: [panel-rs, oobe, finish]
  when: calagopus_oobe_closed.stdout | trim | int == 0
  changed_when: true

- name: Wait out the panel's 60s settings cache before going public
  ansible.builtin.pause:
    seconds: 65
  when: >-
    not ansible_check_mode and (
    calagopus_settings_write is changed
    or calagopus_users_count.stdout | trim | int == 0
    or calagopus_oobe_closed.stdout | trim | int == 0)
