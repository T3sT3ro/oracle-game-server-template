- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - xfsprogs
      - python3-yaml
      - rsync # scripts/publish-site.sh
      - unattended-upgrades
      - needrestart
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Harden sshd (keys only, no root, ubuntu user only)
  block:
    - name: Template sshd hardening drop-in
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        mode: "0644"
      register: base_sshd_dropin

    - name: Validate full sshd config before reloading # noqa: no-handler (must run before the reload handler, inside the rescue block)
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when: base_sshd_dropin is changed
      notify: Reload ssh
  rescue:
    # A broken drop-in would lock us out on the next sshd restart.
    - name: Remove invalid sshd drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-hardening.conf
        state: absent

    - name: Abort after reverting sshd drop-in
      ansible.builtin.fail:
        msg: "sshd config validation failed; drop-in reverted."

- name: Configure unattended upgrades (security + Docker + Tailscale, reboot in maintenance window)
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"

- name: Enable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Load br_netfilter at boot (Wings server firewalls need bridge netfilter)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/br_netfilter.conf
    mode: "0644"
    content: "br_netfilter\n"

- name: Load br_netfilter now
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Apply kernel hardening sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-gameserver.conf
    reload: true
  loop: "{{ base_sysctls | dict2items }}"
