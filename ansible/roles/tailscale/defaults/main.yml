# Dashboards published as Tailscale Services: https://<name>.<tailnet>.ts.net on port 443.
# The names come from group_vars/all/network.yml; the targets are the loopback ports the
# observability role publishes (Grafana 3000, Beszel 8090).
tailscale_services:
  - { name: "{{ grafana_service_name }}", target: "http://127.0.0.1:3000" }
  - { name: "{{ beszel_service_name }}", target: "http://127.0.0.1:8090" }

# Per-port serve entries from before Tailscale Services; removed if still present.
tailscale_legacy_serve_ports: [8443, 8444]
