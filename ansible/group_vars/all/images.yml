# Every container image is pinned by tag AND digest (multi-arch index digest, works on arm64).
# Upgrades are explicit: bump the tag, resolve the new digest with
#   docker buildx imagetools inspect <image:tag> --format '{{json .Manifest.digest}}'
# and run the playbook with --tags calagopus / web / games / observability.
