# Internal Docker addressing. You normally never need to change this.
#
# "web" is the one network that Caddy, the panel and your own apps share. Caddy has a fixed
# address so the panel can trust exactly Caddy (and nothing else) to tell it visitor IPs.
# These ranges stay clear of Wings' game network (172.18.0.0/16) and the cloud network (10.0.0.0/16).
web_network: web
web_subnet: 10.210.1.0/24
# Docker gives containers automatic addresses only from this upper half, so the fixed
# addresses below it (like Caddy's) are never taken by another container.
web_ip_range: 10.210.1.128/25
caddy_ip: 10.210.1.2

# Wings' own network for game servers (Wings' defaults; Wings creates it). Allocations on its
# gateway, 172.18.0.1, are private: Caddy and mc-router can reach them, the internet can't.
wings_network: calagopus_nw
wings_gateway_ip: 172.18.0.1

# Private admin dashboards, published on your tailnet as Tailscale Services:
# https://<name>.<tailnet>.ts.net (no port). Each name must first be defined in the Tailscale
# console (Services → Advertise → Define a Service, endpoint tcp:443); see the README.
grafana_service_name: logs     # Grafana: logs and the security dashboard
beszel_service_name: status    # Beszel: CPU, memory, disk, alerts
