- name: Configure Universal Game Server
  hosts: all
  become: yes

  tasks:
    - name: Ensure basic utilities are installed
      apt:
        name: [xfsprogs, ca-certificates, curl, gnupg, lsb-release, ufw]
        state: present
        update_cache: yes

    - name: Target OCI Block Storage (Usually /dev/sdb on Ampere A1)
      set_fact:
        target_device: "/dev/sdb"

    - name: Format block volume to XFS if unformatted
      filesystem:
        fstype: xfs
        dev: "{{ target_device }}"

    - name: Create mount point directory
      file:
        path: "{{ data_mount_point }}"
        state: directory

    - name: Mount persistent volume via fstab
      mount:
        path: "{{ data_mount_point }}"
        src: "{{ target_device }}"
        fstype: xfs
        state: mounted

    - name: Ensure directories exist safely
      file:
        path: "{{ data_mount_point }}/{{ item }}"
        state: directory
      loop: [caddy, caddy/data, pelican/db, pelican/var, app]

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Detect System Architecture dynamically
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Detect OS release dynamically
      command: lsb_release -cs
      register: lsb_release
      changed_when: false

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ lsb_release.stdout }} stable"
        state: present

    - name: Install Docker Engine and Compose
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: latest
        update_cache: yes

    - name: Enable Firewall rules
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: ['22/tcp', '80/tcp', '443/tcp', '2022/tcp', '8080/tcp', '25565/tcp', '7777/udp']

    - name: Template Caddy proxy rules
      template:
        src: templates/Caddyfile.j2
        dest: "{{ data_mount_point }}/caddy/Caddyfile"

    - name: Template restricted .env file
      template:
        src: templates/.env.j2
        dest: "{{ data_mount_point }}/app/.env"
        mode: '0600' # Strict host-side security
        owner: root

    - name: Template docker-compose file
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ data_mount_point }}/app/docker-compose.yml"

    - name: Start Docker Stack
      command: docker compose up -d
      args:
        chdir: "{{ data_mount_point }}/app"