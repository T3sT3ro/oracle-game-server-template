- name: Configure Universal Game Server
  hosts: all
  become: true

  tasks:
    - name: Ensure basic utilities are installed
      apt:
        name: [xfsprogs, ca-certificates, curl, gnupg, lsb-release, ufw]
        state: present
        update_cache: true

    - name: Target OCI Block Storage (Usually /dev/sdb on Ampere A1)
      set_fact:
        target_device: "/dev/sdb"

    - name: Check if block device exists
      stat:
        path: "{{ target_device }}"
      register: dev_stat

    - name: Format block volume to XFS if unformatted
      filesystem:
        fstype: xfs
        dev: "{{ target_device }}"
      when: dev_stat.stat.exists

    - name: Create mount point directory
      file:
        path: "{{ data_mount_point }}"
        state: directory

    - name: Mount persistent volume via fstab
      mount:
        path: "{{ data_mount_point }}"
        src: "{{ target_device }}"
        fstype: xfs
        state: mounted
      when: dev_stat.stat.exists

    - name: Ensure directories exist safely
      file:
        path: "{{ data_mount_point }}/{{ item }}"
        state: directory
      loop: [caddy, caddy/data, pelican/db, pelican/var, app]

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Detect System Architecture dynamically
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Detect OS release dynamically
      command: lsb_release -cs
      register: lsb_release
      changed_when: false

    - name: Add Docker Repository
      deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ lsb_release.stdout }}"]
        components: [stable]
        architectures: ["{{ dpkg_arch.stdout }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        install_python_debian: true

    - name: Install Docker Engine and Compose
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: latest
        update_cache: true

    - name: Configure Docker to use VFS driver for local test environment
      copy:
        content: |
          {
            "storage-driver": "vfs"
          }
        dest: /etc/docker/daemon.json
      when: not dev_stat.stat.exists

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Configure UFW Firewall rules
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: '22', proto: 'tcp' }
        - { port: '80', proto: 'tcp' }
        - { port: '443', proto: 'tcp' }
        - { port: '2022', proto: 'tcp' }
        - { port: '8080', proto: 'tcp' }
        - { port: '25565', proto: 'tcp' }
        - { port: '25565', proto: 'udp' }

    - name: Enable UFW Firewall
      ufw:
        state: enabled

    - name: Template Caddy proxy rules
      template:
        src: templates/Caddyfile.j2
        dest: "{{ data_mount_point }}/caddy/Caddyfile"

    - name: Template restricted .env file
      template:
        src: templates/.env.j2
        dest: "{{ data_mount_point }}/app/.env"
        mode: '0600' # Strict host-side security
        owner: root

    - name: Template docker-compose file
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ data_mount_point }}/app/docker-compose.yml"

    - name: Start Docker Stack
      command: docker compose up -d
      args:
        chdir: "{{ data_mount_point }}/app"