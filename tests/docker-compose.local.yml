services:
  local-node:
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    container_name: oci_test_node
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - test-docker-data:/var/lib/docker
    cgroup: host
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "25565:25565" # Game Server TCP/UDP Port

volumes:
  test-docker-data: